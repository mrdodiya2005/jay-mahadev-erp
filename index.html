<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Mahadev - Final Cloud ERP</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #0f172a; --secondary: #3b82f6; --bg: #f3f4f6; --text: #1f2937; --card: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 0; }
        .navbar { background-color: var(--primary); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .party-item { display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 5px solid var(--secondary); padding: 15px; background: white; border-radius: 8px; margin-bottom: 10px; transition: 0.2s; }
        .party-item:hover { background: #f1f5f9; }
        .bal-red { color: #dc2626; font-weight: bold; font-size: 18px; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; font-size: 14px; }
        .btn-blue { background: var(--secondary); color: white; }
        .btn-green { background: #059669; color: white; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        #dashboard, #details, #invoice { display: none; }
        .active { display: block !important; }
        .back-btn { position: absolute; left: 15px; top: 15px; color: white; background: none; border: none; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

<div class="navbar">
    <button class="back-btn" id="backBtn" onclick="goHome()" style="display:none;">← Back</button>
    <h2 id="navTitle">JAY MAHADEV</h2>
</div>

<div class="container">
    <div id="dashboard" class="active">
        <div class="card">
            <input type="text" id="pNameInput" placeholder="Enter New Party Name...">
            <button class="btn btn-blue" onclick="createParty()">+ Add New Party</button>
        </div>
        <div id="pListContainer"></div>
    </div>

    <div id="details">
        <div class="card" style="text-align: center;">
            <h2 id="activePName">Party</h2>
            <p>Old Balance: <span id="activePBal" class="bal-red">0</span></p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-blue" onclick="showInput('qty')">+ Add Qty</button>
            <button class="btn btn-green" onclick="showInput('pay')">+ Add Payment</button>
        </div>
        <div id="inputBox" class="card" style="display:none; margin-top:15px;">
            <h4 id="inputTitle">Entry</h4>
            <input type="date" id="inputDate">
            <input type="number" id="inputVal" placeholder="Enter Value...">
            <button class="btn btn-blue" onclick="submitToCloud()">Save to Cloud</button>
        </div>
        <button class="btn btn-blue" style="margin-top:20px; background:#1e293b;" onclick="generateBill()">🧾 View & Print Bill</button>
        <div id="history" style="margin-top:20px;"></div>
    </div>

    <div id="invoice">
        <div class="card">
            <h3>Invoice Preview</h3>
            <p>Party: <span id="invName"></span></p>
            <hr>
            <div id="invTable"></div>
            <button class="btn btn-green" onclick="window.print()">Print PDF</button>
            <button class="btn btn-blue" style="background:#dc2626;" onclick="clearAndSave()">Close Cycle & Update Bal</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAFsTJ3b4vPDC5ZdDEe-6dd8EbUcGK7Sb8",
        authDomain: "dai-bill.firebaseapp.com",
        databaseURL: "https://dai-bill-default-rtdb.firebaseio.com",
        projectId: "dai-bill",
        storageBucket: "dai-bill.firebasestorage.app",
        messagingSenderId: "222835726511",
        appId: "1:222835726511:web:3bc69cc170d5019393dc5a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let parties = {};
    let currentP = null;
    let entryMode = '';

    // Real-time listener
    db.ref('parties').on('value', (snapshot) => {
        parties = snapshot.val() || {};
        renderList();
        if(currentP) updateDetailView();
    });

    function renderList() {
        const container = document.getElementById('pListContainer');
        container.innerHTML = '';
        Object.keys(parties).forEach(name => {
            const div = document.createElement('div');
            div.className = 'party-item';
            div.onclick = () => openParty(name);
            div.innerHTML = `<span>${name}</span><span class="bal-red">₹ ${parties[name].balance}</span>`;
            container.appendChild(div);
        });
    }

    function createParty() {
        const n = document.getElementById('pNameInput').value.trim().toUpperCase();
        if(!n) return;
        db.ref('parties/' + n).set({ balance: 0, entries: [], payments: [] });
        document.getElementById('pNameInput').value = '';
    }

    function openParty(name) {
        currentP = name;
        switchScreen('details');
        updateDetailView();
    }

    function updateDetailView() {
        const p = parties[currentP];
        document.getElementById('activePName').innerText = currentP;
        document.getElementById('activePBal').innerText = "₹ " + p.balance;
        const h = document.getElementById('history');
        h.innerHTML = '<h4>Recent History</h4>';
        (p.entries || []).forEach(e => h.innerHTML += `<div class='card' style='padding:10px; margin-bottom:5px;'>📦 ${e.date}: ${e.val} Units</div>`);
        (p.payments || []).forEach(pay => h.innerHTML += `<div class='card' style='padding:10px; margin-bottom:5px; color:green;'>💰 ${pay.date}: ₹${pay.val}</div>`);
    }

    function showInput(m) {
        entryMode = m;
        document.getElementById('inputBox').style.display = 'block';
        document.getElementById('inputTitle').innerText = m === 'qty' ? 'Add Quantity' : 'Add Payment';
        document.getElementById('inputDate').valueAsDate = new Date();
    }

    function submitToCloud() {
        const d = document.getElementById('inputDate').value.split('-').reverse().join('/');
        const v = parseFloat(document.getElementById('inputVal').value);
        if(!v) return;
        const path = entryMode === 'qty' ? 'entries' : 'payments';
        const list = parties[currentP][path] || [];
        list.push({date: d, val: v});
        db.ref('parties/' + currentP + '/' + path).set(list);
        document.getElementById('inputBox').style.display = 'none';
        document.getElementById('inputVal').value = '';
    }

    function switchScreen(id) {
        ['dashboard', 'details', 'invoice'].forEach(s => document.getElementById(s).classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('backBtn').style.display = id === 'dashboard' ? 'none' : 'block';
    }

    function goHome() { currentP = null; switchScreen('dashboard'); }
    
    // Additional logic for billing can go here...
</script>
</body>
</html>
